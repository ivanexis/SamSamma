<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="wf-plans-title wf-plans-desc">
  <title id="wf-plans-title">Low-Fi Wireframe｜index_SamSamma.html #plans (v5.8.3)</title>
  <desc id="wf-plans-desc">v5.8.3 Plans 區塊 4 欄等寬 plan-card grid（desktop-first ≥768px）；每張卡 = 圖片(4:3) + persona tag + icon + title + subtitle + desc + 4 features + CTA。共 4 條 Persona 路徑：文化體驗 / ESG 企業 / 竹炭商品 / 國際藝術。</desc>
  <defs>
    <pattern id="grid-pl" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#eaeaea" stroke-width="0.5"/>
    </pattern>
    <pattern id="img-fill" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 0 6 L 6 0" stroke="#d0d0d0" stroke-width="0.5"/>
    </pattern>
    <style>
      text { font-family: "Noto Sans TC", "Inter", "Microsoft JhengHei", sans-serif; }
      .frame    { fill:#fff; stroke:#222; stroke-width:1.5; }
      .card     { fill:#fff; stroke:#444; stroke-width:1.2; }
      .img      { fill:url(#img-fill); stroke:#888; stroke-width:1; }
      .tag-box  { fill:#fff; stroke:#d4af37; stroke-width:1.2; }
      .icon     { fill:#fff; stroke:#2c5530; stroke-width:1.4; }
      .cta      { fill:#2c5530; stroke:#1a3d22; stroke-width:1.4; }
      .meta     { font-size:10px; fill:#888; font-family:"Fira Code", monospace; }
      .label-sm { font-size:9px; fill:#666; }
      .head     { font-size:12px; fill:#1a1a1a; font-weight:700; }
      .cta-tx   { font-size:9px; fill:#fff; font-weight:700; font-family:"Inter", sans-serif; }
      .annot    { font-size:10px; fill:#c2185b; font-style:italic; }
      .title-c  { font-size:18px; fill:#2c5530; font-weight:700; }
      .tag-tx   { font-size:9px; fill:#7a5500; font-family:"Inter", sans-serif; }
    </style>
  </defs>

